schema_version: 1
name: github-pages

registry: config/toolchains.yml
canonical_projects: config/canonical-projects.yml

selection:
  # Publish one explicitly selected version per project. Existing immutable
  # release archives retain previous versions; URLs remain version-qualified.
  mode: canonical
  exclude:
    - books/ProbabilityTheory_Klenke_2020
    - books/ComputationalMethodsInverseProblems_Vogel_2002

site:
  base_path: /ReasBook/
  include_historical_versions: true

policy:
  allow_partial: false
  require_lean: true
  require_docs: true
  require_verso: true
  theorem_graph: compiled_or_source
  max_site_files: 100000
  max_bundle_bytes: 1900000000

# A release has one build identity and two immutable delivery artifacts.
# The full artifact retains bounded reachable project-module API docs and every
# selected project version for self-hosting. Pages keeps canonical Verso routes and all
# API pages owned by every selected ProjectSpec; omitted external-dependency
# API links become explicit placeholders whose source pages must exist in the
# verified full artifact.
artifacts:
  full:
    history_mode: full
    dependency_docs: stubs
    max_site_files: 500000
    max_site_bytes: 100000000000
    max_archive_members: 1501024
    max_bundle_bytes: 20000000000
  pages:
    history_mode: canonical
    dependency_docs: stubs
    max_site_files: 60000
    max_site_bytes: 970000000
    max_archive_members: 180000
    max_bundle_bytes: 950000000

publish:
  adapter: github_pages
  repository: optpku/ReasBook
  release_tag_prefix: reasbook-site
  workflow: publish_release_pages.yml
