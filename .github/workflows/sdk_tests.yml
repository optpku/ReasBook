name: Test ReasBook SDKs

on:
  push:
    paths:
      - "sdk/**"
      - "scripts/**"
      - "tests/**"
      - "ReasBookWeb/scripts/**"
      - "ReasBookWeb/ReasBookSite/**"
      - "ReasBookWeb/ReasBookSite.lean"
      - "ReasBookWeb/static_files/**"
      - "config/toolchains.yml"
      - "config/canonical-projects.yml"
      - "config/deploy/**"
      - "config/schemas/release-spec.schema.json"
      - ".github/workflows/**"
  pull_request: {}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-24.04
    env:
      REASBOOK_PYTHON_BIN: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install quality tools
        run: python -m pip install ruff==0.6.3 PyYAML==6.0.3
      - name: Static checks
        run: |
          python -m ruff check sdk scripts tests ReasBookWeb/scripts
          find sdk scripts tests ReasBookWeb/scripts -type f -name '*.py' -print0 \
            | xargs -0 python -m py_compile
          find sdk scripts -type f -name '*.sh' -print0 \
            | xargs -0 -n1 bash -n
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in sorted(Path('.github/workflows').glob('*.yml')):
              with path.open(encoding='utf-8') as stream:
                  yaml.safe_load(stream)
          PY
      - name: Run SDK tests
        run: ./sdk/test.sh
      - name: Run repository adapter tests
        run: ./sdk/common/bin/python -m unittest discover -s tests -v
      - name: Install all SDK packages
        run: |
          python -m pip install -e sdk/common -e sdk/build -e sdk/verso \
            -e sdk/theorem_graph -e sdk/comparator -e sdk/deploy
      - name: Smoke test console entrypoints
        run: |
          sdk/build/bin/reasbook-build --help >/dev/null
          sdk/verso/bin/verso-build --help >/dev/null
          sdk/theorem_graph/bin/theorem-graph --help >/dev/null
          sdk/comparator/bin/comparator --help >/dev/null
          sdk/deploy/bin/reasbook-deploy --help >/dev/null
          sdk/deploy/bin/reasbook-deploy release --help >/dev/null
      - name: Validate GitHub workflow policy
        run: ./sdk/common/bin/python -m unittest tests.test_github_workflows -v
      - name: Reject whitespace errors
        run: git diff --check

  browser-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REASBOOK_SIDEBAR_BROWSER_TEST: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install browser test dependencies
        run: python -m pip install playwright==1.62.0
      - name: Install Chromium and system dependencies
        run: python -m playwright install --with-deps chromium
      - name: Test reader navigation and responsive layouts in Chromium
        run: python -m unittest tests.test_sidebar_navigation -v
