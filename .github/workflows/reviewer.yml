name: Test ReasBook Reviewer

on:
  pull_request: {}
  push:
    paths:
      - "apps/reasbook-reviewer/**"
      - "sdk/**"
      - "config/**"
      - "docker-compose.reviewer.yml"
      - "docker/reviewer.nginx.conf"
      - ".github/workflows/reviewer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reviewer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      REASBOOK_CACHE_ROOT: /tmp/reasbook-reviewer-ci-cache
      REASBOOK_PYTHON_BIN: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install web and quality dependencies
        run: python -m pip install -r apps/reasbook-reviewer/requirements.txt httpx ruff==0.6.3 pip-audit
      - name: Static checks
        run: |
          python -m ruff check apps/reasbook-reviewer
          python -m compileall -q apps/reasbook-reviewer
          bash -n apps/reasbook-reviewer/start_server.sh
          node --check apps/reasbook-reviewer/docs/app.js
          node --check apps/reasbook-reviewer/docs/mathjax-config.js
          node --check sdk/theorem_graph/src/theorem_graph_sdk/resources/assets/app.js
          node apps/reasbook-reviewer/tests/statement_rendering.cjs
          node apps/reasbook-reviewer/tests/evidence_status.cjs
          node sdk/theorem_graph/tests/test_graph_view.js
          git diff --check
      - name: Tests with isolated runtime state
        working-directory: apps/reasbook-reviewer
        run: python -m unittest discover -s tests -v
      - name: Audit runtime dependencies
        run: python -m pip_audit -r apps/reasbook-reviewer/requirements.txt
      - name: Build and check container deployment
        env:
          REASBOOK_REVIEWER_STATE_DIR: ${{ runner.temp }}/reasbook-state
          REASBOOK_REVIEWER_PORT: "18876"
        run: |
          mkdir -p "$REASBOOK_CACHE_ROOT" "$REASBOOK_REVIEWER_STATE_DIR"
          export REASBOOK_REVIEWER_UID="$(id -u)" REASBOOK_REVIEWER_GID="$(id -g)"
          docker compose -f docker-compose.reviewer.yml config --quiet
          trap 'docker compose -f docker-compose.reviewer.yml logs; docker compose -f docker-compose.reviewer.yml down' EXIT
          docker compose -f docker-compose.reviewer.yml up --build -d --wait --wait-timeout 120
          curl --fail --retry 10 --retry-delay 1 --retry-connrefused http://127.0.0.1:18876/ReasBook/api/health
          curl --fail http://127.0.0.1:18876/ReasBook/ >/dev/null
          curl --fail http://127.0.0.1:18876/ReasBook/assets/app.js >/dev/null
